const rawScores = {};
const maxScores = {};

questions.forEach(q=>{
  for(const [course,aff] of Object.entries(q.affinities)){
    rawScores[course]=0;
    maxScores[course]=(maxScores[course]||0)+(2*aff);
  }
});

function renderQuestion(i){
  const q = questions[i];
  $("#questionText").text(q.text);
  const optionLabels = ["strongly-agree","agree","neutral","disagree","strongly-disagree"];
  const optionText = ["Strongly Agree","Agree","Neutral","Disagree","Strongly Disagree"];
  
  $("#optionsContainer").html(optionLabels.map((val,idx)=>`
    <div class="option ${val}">
      <input type="radio" name="answer" id="${val}" value="${val}" ${q.selected===val ? "checked" : ""}>
      <label for="${val}"></label><p>${optionText[idx]}</p>
    </div>`).join('') + '<div class="likert-line"></div>');

  $("#progressBar").css("width", Math.round(i/questions.length*100)+"%");

  // Previous button
  if($("#prevBtn").length === 0){
    $(".text-center").prepend('<button id="prevBtn" class="btn-next me-2">Previous</button>');
  }
  $("#prevBtn").prop("disabled", i===0);
  $("#prevBtn").off('click').on('click', ()=>{
    if(autoSubmitTimeout) clearTimeout(autoSubmitTimeout);
    if(current > 0){
      current--;
      renderQuestion(current);
    }
  });
  // Auto-submit after 1 second
  $("input[name='answer']").off('change').on('change', function(){
    const selectedVal = $(this).val();
    q.selected = selectedVal;
    if(autoSubmitTimeout) clearTimeout(autoSubmitTimeout);
    autoSubmitTimeout = setTimeout(()=>{
      const val = ANSWER_VALUE[selectedVal];
      for(const [course,aff] of Object.entries(q.affinities)) rawScores[course] += val*aff;
      current++;
      if(current < questions.length){
        renderQuestion(current);
      } else {
        showResults();
      }
    }, DELAY_MS);
  });
}

function showResults(){
  const results=[];
  let totalScore=0;
  for(const course of Object.keys(rawScores)){
    const raw=rawScores[course];
    const max=maxScores[course]||1;
    const pct=Math.max(0,Math.min(100,(raw/max)*100));
    totalScore+=pct;
    results.push({course,raw,max,pct});
  }

  results.sort((a,b)=>b.pct-a.pct);
  const top3=results.slice(0,3);

  $("#quizSection").hide();
  $("#resultsSection").show();
  const $list=$("#top3List");
  $list.empty();

  top3.forEach((r,idx)=>{
    $list.append(`
      <div class="result-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="flex:1;">
            <div class="result-title">${idx+1}. ${r.course}</div>
            <div class="result-sub">Match: ${r.pct.toFixed(1)}% (Score: ${r.raw.toFixed(1)}/${r.max.toFixed(1)})</div>
            <div class="progress" style="height:10px; border-radius:6px; overflow:hidden;">
              <div class="progress-bar" role="progressbar" style="width:${r.pct}%; background:#070069;"></div>
            </div>
          </div>
        </div>
      </div>`);
  });

  $("#totalScore").text("Total score (sum of % across all courses): "+totalScore.toFixed(1));
}

$("#retakeBtn").click(()=>{
  for(const k in rawScores) rawScores[k]=0;
  current=0;
  questions.forEach(q=>q.selected=null);
  $("#resultsSection").hide();
  $("#quizSection").show();
  renderQuestion(0);
  $("#progressBar").css("width","0%");
});

$(document).ready(()=>{ renderQuestion(0); });
