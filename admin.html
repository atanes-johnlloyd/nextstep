<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NextStep — Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- DataTables CSS -->
  <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet">
  <link href="admin.css" rel="stylesheet">
</head>
<body>
  <div class="admin-wrap d-flex">

    <!-- left nav -->
    <aside class="sidebar bg-deep px-3 py-4">
      <div class="brand mb-4">
        <div class="brand-logo">NextStep</div>
      </div>
      <nav class="nav flex-column" id="sideNav">
        <a href="#" class="nav-link nav-item active" data-page="pages/dashboard.php">Dashboard</a>
        <a href="#" class="nav-link nav-item" data-page="pages/manage_questionnaires.php">Manage Questionnaires</a>
        <a href="#" class="nav-link nav-item" data-page="pages/manage_programs.php">Manage Programs</a>
        <a href="#" class="nav-link nav-item" data-page="pages/manage_statistics.php">Manage Statistics</a>
        <a href="#" class="nav-link nav-item" data-page="pages/manage_user_results.php">Manage User Results</a>
        <a href="#" class="nav-link nav-item" data-page="pages/manage_admin_accounts.php">Manage Admin Accounts</a>
        <a href="#" class="nav-link nav-item" data-page="pages/system_settings.php">System Settings</a>
      </nav>
    </aside>

    <!-- main content -->
    <main class="content-area p-4">
      <header class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="pageTitle">Admin Dashboard</h2>
        <div><a id="logoutBtn" href="#" class="text-decoration-none">Log out</a></div>
      </header>

      <div id="contentArea">
        <!-- initial content (dashboard) will be loaded by JS via AJAX -->
        <div class="loading-placeholder">Loading...</div>
      </div>
    </main>
  </div>

  <!-- dependencies -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
<script>
    $(function(){
  // load default page
  loadPage('pages/dashboard.php');

  // nav click
  $('#sideNav .nav-link').on('click', function(e){
    e.preventDefault();
    $('#sideNav .nav-link').removeClass('active');
    $(this).addClass('active');
    const page = $(this).data('page');
    loadPage(page);
  });

  // loader function (loads HTML fragments into #contentArea)
  function loadPage(url){
    $('#contentArea').html('<div class="loading-placeholder">Loading...</div>');
    $.get(url).done(function(html){
      $('#contentArea').html(html);
      // update title from returned markup or fallback
      const title = $('#contentArea').find('[data-page-title]').data('page-title');
      $('#pageTitle').text(title || 'Admin');
      // initialize DataTables if present
      if ($('#datatable').length) {
        $('#datatable').DataTable();
      }
    }).fail(function(){
      $('#contentArea').html('<div class="alert alert-danger">Failed to load page.</div>');
    });
  }

  // logout stub
  $('#logoutBtn').on('click', function(e){
    e.preventDefault();
    alert('Logout action - implement on server');
  });

});
</script>
</html>
